AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless URL Shortener - API Gateway (HTTP API) + Lambda + DynamoDB

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 128
    Timeout: 5
    Environment:
      Variables:
        TABLE_NAME: !Ref UrlTable

Resources:
  UrlTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: url-shortener
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shortCode
          AttributeType: S
      KeySchema:
        - AttributeName: shortCode
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    # No custom domain by default. To add one later, uncomment and fill in:
    # Properties:
    #   Domain:
    #     DomainName: short.yourdomain.com
    #     CertificateArn: arn:aws:acm:...
    #     Route53:
    #       HostedZoneId: Z0123456789ABCDEF

  CreateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: create_handler.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlTable
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /urls
            Method: POST

  RedirectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: redirect_handler.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UrlTable
      Events:
        Redirect:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{shortCode}
            Method: GET

  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: stats_handler.handler
      CodeUri: src/
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UrlTable
      Events:
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /urls/{shortCode}/stats
            Method: GET

Outputs:
  ApiEndpoint:
    Description: Default API URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Value: !Ref UrlTable